# ===========================
# Mosquitto configuration
# Render + Cloudflare Tunnel
# ===========================

# 🔹 Основний MQTT listener (для bridge.py)
listener 1883
protocol mqtt
allow_anonymous true
persistence false
max_inflight_messages 50
autosave_interval 0
connection_messages true
log_type all

# 🔹 WebSocket listener (для Cloudflare Tunnel)
listener 10000
protocol websockets

# 🔹 Додаткові параметри безпеки та стабільності
allow_zero_length_clientid true
max_keepalive 300
socket_domain ipv4
