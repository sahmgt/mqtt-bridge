# ===========================
# Mosquitto configuration
# Render + Cloudflare Tunnel
# ===========================

# 🔹 Основний MQTT listener (для локального bridge.py)
listener 1883
protocol mqtt
allow_anonymous true
persistence false
max_inflight_messages 50
autosave_interval 0
connection_messages true
log_type all

# 🔹 WebSocket listener (для Cloudflare Tunnel)
listener 10000
protocol websockets

# 🧩 Важливо! Увімкнути коректні HTTP-заголовки для WebSocket
http_dir /usr/share/mosquitto/www
websockets_headers_size 8192
websockets_log_level 2

# 🔒 Без авторизації (оскільки Render ізольований)
allow_anonymous true

# 🔹 Додаткові параметри стабільності
allow_zero_length_clientid true
max_keepalive 300
socket_domain ipv4

# 🔹 Запобігання помилкам "protocol error"
# (Cloudflare Tunnel перевіряє з'єднання на /)
listener 8080
protocol http
